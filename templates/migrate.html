<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Migrate</title>
    {% include 'common-head.html' %}
</head>
<body>

<div class="ui segment" style="margin: 10px">
    <h2 class="ui right floated header">Migrate to another server</h2>
    <form class="ui form" method="post" action="{% url 'admin-migrate' %}" enctype="multipart/form-data">
        <div class="field">
            <label>Server ip</label>
            <input type="text" name="server-ip" placeholder="IP" required>
        </div>
        <div class="field">
            <label>SSH Username</label>
            <input type="text" name="username" placeholder="Username" required>
        </div>
        <div class="field">
            <label>SSH Password</label>
            <input type="password" name="password" placeholder="Password" required>
        </div>
        <div class="field">
            <label>SSH Port</label>
            <input type="number" name="port" placeholder="Port" required>
        </div>

        {% csrf_token %}

        <button class="ui button" type="submit">Migrate</button>
    </form>
</div>

</body>
</html>
