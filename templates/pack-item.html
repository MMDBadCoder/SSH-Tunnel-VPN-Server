<div class="item">

    {% if pack.finished %}
        <i class="icon close red large"></i>
    {% elif pack.started %}
        <div class="right floated content">
            <button class="ui button" id="android-connection-{{ pack.id }}">
                <i class="android icon green large"></i> Android
            </button>
            <script>
                $('#android-connection-{{ pack.id }}').click(function () {
                    Swal.fire({
                        title: '<strong><u>Android connection</u></strong>',
                        icon: 'info',
                        html: '<div class="ui list">' +
                            '    <div class="item">' +
                            '        1. Download this <a href="/static/ssh-injector.apk">android application</a>.' +
                            '    </div>' +
                            '    <div class="item">' +
                            '        2. Enter settings similar to this <a href="/static/secure-shell-setting.mp4">video</a>.' +
                            '    </div>' +
                            '    <div class="item">' +
                            '        3. Enter the following values in ssh settings.' +
                            '    </br>' +
                            '        <ul class="ui list">' +
                            '            <li value="-">hostname: {{ HOSTNAME }}</li>' +
                            '            <li value="-">port: {{ pack.port }}</li>' +
                            '            <li value="-">username: {{ pack.linux_username }}</li>' +
                            '            <li value="-">password: {{ pack.linux_password }}</li>' +
                            '        </ul>' +
                            '    </div>' +
                            '</div>'
                    });
                })
            </script>
        </div>
        <div class="right floated content">
            <button class="ui button" id="windows-connection-{{ pack.id }}">
                <i class="windows icon blue large"></i> Windows
            </button>
            <script>
                $('#windows-connection-{{ pack.id }}').click(function () {
                    Swal.fire({
                        title: '<strong><u>Windows connection</u></strong>',
                        icon: 'info',
                        html: '<div class="ui list">' +
                            '    <div class="item">' +
                            '        1. Download this <a href="/static/putty.exe">File</a>.' +
                            '    </div>' +
                            '    <div class="item">' +
                            '        2. Download this <a href="{% url 'user-putty-cmd' pack.id %}">executable file</a>.' +
                            '    </div>' +
                            '    <div class="item">' +
                            '        3. Put both files together and execute proxy.cmd' +
                            '    </div>' +
                            '    <div class="item">' +
                            '        4. Now you have proxy on port 10808, and you can connect all your apps to this proxy by these configs:' +
                            '<br>' +
                            ' server: 127.0.0.1' +
                            '<br>' +
                            'port: 10808' +
                            '    </div>' +
                            '</div>'
                    });
                })
            </script>
        </div>
        <div class="right floated content">
            <button class="ui button" id="linux-connection-{{ pack.id }}">
                <i class="linux icon black large"></i> Linux
            </button>
            <script>
                $('#linux-connection-{{ pack.id }}').click(function () {
                    Swal.fire({
                        title: '<strong><u>Linux connection</u></strong>',
                        icon: 'info',
                        html: '<div class="ui list">' +
                            '    <div class="item">' +
                            '        install sshpass by this command:</br>' +
                            '        <code>sudo apt-get install -y sshpass</code>' +
                            '    </div>' +
                            '    <div class="item">' +
                            '        2. Download this <a href="{% url 'user-linux-shell' pack.id %}">shell file</a>.' +
                            '    </div>' +
                            '    <div class="item">' +
                            '        3. run it.' +
                            '    </div>' +
                            '    <div class="item">' +
                            '        4. Now you have proxy on port 10808, and you can connect all your apps to this proxy by these configs:' +
                            '<br>' +
                            ' server: 127.0.0.1' +
                            '<br>' +
                            'port: 10808' +
                            '    </div>' +
                            '</div>'
                    });
                })
            </script>
        </div>
        <div class="right floated content">
            <button class="ui button" id="ios-connection-{{ pack.id }}">
                <i class="apple icon grey large"></i> IOS
            </button>
            <script>
                $('#ios-connection-{{ pack.id }}').click(function () {
                    Swal.fire({
                        title: '<strong><u>IOS connection</u></strong>',
                        icon: 'info',
                        html: '<div class="ui list">' +
                            '    <div class="item">' +
                            '        1. Install <a href="https://apps.apple.com/us/app/napsternetv/id1629465476">NapsternetV</a> from apple store.' +
                            '    </div>' +
                            '    <div class="item">' +
                            '        2. See this <a href="https://torguard.net/indexori.php?rp=/knowledgebase/312/How-to-connect-with-SSH-tunnel-on-iOS-using-NapsternetV.html">tutorial</a>.' +
                            '    </div>' +
                            '    <div class="item">' +
                            '        3. Enter the following values in ssh settings.' +
                            '    </br>' +
                            '        <ul class="ui list">' +
                            '            <li value="-">hostname: {{ HOSTNAME }}</li>' +
                            '            <li value="-">port: {{ pack.port }}</li>' +
                            '            <li value="-">username: {{ pack.linux_username }}</li>' +
                            '            <li value="-">password: {{ pack.linux_password }}</li>' +
                            '        </ul>' +
                            '    </div>' +
                            '</div>'
                    });
                })
            </script>
        </div>
        <div class="right floated content">
            <button class="ui inverted grey button" id="test-{{ pack.id }}" style="font-weight: bold; color: green">
                <i class="icon large green check circle outline"></i> Connection Test
            </button>
            <script>
                $('#test-{{ pack.id }}').click(function () {

                    let timerInterval;
                    let timeout = 5000;
                    let successful = false;
                    Swal.fire({
                        title: 'Connection test',
                        html: 'It takes <b></b> milliseconds to connect.',
                        timer: timeout,
                        timerProgressBar: true,
                        didOpen: () => {
                            $.ajax({
                                type: 'GET',
                                url: "{% url 'user-pack-test' pack.id %}",
                                success: function (response) {
                                    if (response === 'True') {
                                        successful = true;
                                    }
                                    Swal.close();
                                    clearInterval(timerInterval)
                                },
                                error: function (response) {
                                    console.log(response);
                                    Swal.close();
                                    clearInterval(timerInterval)
                                }
                            });
                            Swal.showLoading()
                            const b = Swal.getHtmlContainer().querySelector('b')
                            timerInterval = setInterval(() => {
                                b.textContent = timeout - Swal.getTimerLeft()
                            }, 100)
                        },
                        willClose: () => {
                            clearInterval(timerInterval)
                        }
                    }).then((result) => {
                        if (successful === false) {
                            Swal.fire({
                                icon: 'error',
                                title: 'Oops...',
                                text: 'Something went wrong!',
                                timer: 1500
                            });
                        } else {
                            Swal.fire({
                                icon: 'success',
                                title: 'Connection was successful.',
                                timer: 1500
                            })
                        }
                    })
                })
            </script>
        </div>
        <i class="icon check green large"></i>
    {% else %}
        <div class="right floated content">
            <a href="{% url 'user-start-pack' pack.id %}">
                <button class="positive ui button">Start</button>
            </a>
        </div>
        <i class="icon info orange large"></i>
    {% endif %}

    <div class="content">
        <a class="header">Pack {{ pack.id }} ({{ pack.days }} Days)</a>
        <div class="description">
            {% if pack.finished %}
                Expired
            {% elif pack.started %}
                In use, Started from {{ pack.start_time | timesince }} ago
            {% else %}
                Not started yet
            {% endif %}
        </div>
    </div>

</div>
