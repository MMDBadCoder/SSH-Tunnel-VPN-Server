<!DOCTYPE html>
<html lang="en">
<head>
    <title>Backup</title>
    {% include 'common-head.html' %}
</head>


<body>

<div class="ui segment big-container" style="background-color: whitesmoke; margin: 15px; padding: 15px">
    <h2 class="ui right floated header">Backup</h2>
    <div class="ui clearing divider"></div>
    <h3>Get backup</h3>
    <a href="{% url 'download-backup' %}" target="_blank" style="display: flex">
        <button class="ui inverted green button" style="float: right">
            Download Backup
        </button>
    </a>
    <div class="ui clearing divider"></div>
    <h3>Inject backup</h3>

    <form action="{% url 'inject-backup' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="ui form">
            <div class="field">
                <label style="color: darkblue">SQLite file</label>
                <input type="file" style="color: darkblue" formenctype="multipart/form-data" name="db" required>
            </div>
            <div class="field" style="display: flex">
                <button type="submit" class="ui inverted green button" style="float: right">
                    Inject
                </button>
            </div>
        </div>
    </form>
</div>

</body>
</html>
